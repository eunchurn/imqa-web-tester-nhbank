name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_IMQA_COLLECTOR_URL: ${{ secrets.NEXT_PUBLIC_IMQA_COLLECTOR_URL }}
          NEXT_PUBLIC_IMQA_SERVICE_NAME: ${{ secrets.NEXT_PUBLIC_IMQA_SERVICE_NAME }}
          NEXT_PUBLIC_IMQA_SERVICE_VERSION: ${{ secrets.NEXT_PUBLIC_IMQA_SERVICE_VERSION }}
          NEXT_PUBLIC_IMQA_SERVICE_KEY: ${{ secrets.NEXT_PUBLIC_IMQA_SERVICE_KEY }}
          NEXT_PUBLIC_IMQA_SERVICE_NAMESPACE: ${{ secrets.NEXT_PUBLIC_IMQA_SERVICE_NAMESPACE }}
          NEXT_PUBLIC_IMQA_DEPLOYMENT_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_IMQA_DEPLOYMENT_ENVIRONMENT }}
          NEXT_PUBLIC_IMQA_DEBUG: ${{ secrets.NEXT_PUBLIC_IMQA_DEBUG }}
          NEXT_PUBLIC_IMQA_SAMPLING_PROBABILITY: ${{ secrets.NEXT_PUBLIC_IMQA_SAMPLING_PROBABILITY }}
          NEXT_PUBLIC_IMQA_CONSOLE_CAPTURE: ${{ secrets.NEXT_PUBLIC_IMQA_CONSOLE_CAPTURE }}
          NEXT_PUBLIC_IMQA_ADVANCED_NETWORK_CAPTURE: ${{ secrets.NEXT_PUBLIC_IMQA_ADVANCED_NETWORK_CAPTURE }}
          NEXT_PUBLIC_IMQA_DISABLE_REPLAY: ${{ secrets.NEXT_PUBLIC_IMQA_DISABLE_REPLAY }}
          NEXT_PUBLIC_IMQA_CAPTURE_METRICS: ${{ secrets.NEXT_PUBLIC_IMQA_CAPTURE_METRICS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
